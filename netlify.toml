[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.84.4"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# Macro & Fiscal Monitor: served from the macro-dashboard repo on GitHub Pages, shown
# under this domain. Status 200 = proxy (rewrite), so the URL stays eliobolliger.com/dashboard/.
[[redirects]]
  from = "/dashboard/*"
  to = "https://elio-rico.github.io/macro-dashboard/:splat"
  status = 200
  force = true

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true
